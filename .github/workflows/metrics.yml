name: Profile metrics

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-metrics
  cancel-in-progress: false

jobs:
  metrics:
    name: Generate GitHub profile metrics
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check metrics credential
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          if [ -z "$METRICS_TOKEN" ]; then
            echo "::error::Add a scope-less classic personal access token as the METRICS_TOKEN repository secret."
            exit 1
          fi

      - name: Render activity, languages, and contribution calendar
        # Pinned to the upstream latest release branch as reviewed during setup.
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ github.token }}
          user: mazeneldeeb9
          filename: github-metrics.svg
          template: classic
          base: header, activity
          config_timezone: Africa/Cairo
          config_display: columns
          config_animations: "no"
          config_order: base.header, base.activity, languages, isocalendar
          repositories_affiliations: owner
          repositories_forks: "no"
          plugin_languages: "yes"
          plugin_languages_limit: 6
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_isocalendar: "yes"
          plugin_isocalendar_duration: half-year
          plugins_errors_fatal: "yes"
